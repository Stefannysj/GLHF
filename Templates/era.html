<article class="era" id="{{id}}" aria-labelledby="{{id}}-title" data-era="{{id}}">
<div class="era-stamp"><span class="eyebrow">{{kicker}}</span><span class="era-period">{{period}}</span></div>
<div class="era-body"><h3 id="{{id}}-title" tabindex="-1">{{title}}</h3><p class="era-description">{{description}}</p><div class="tags">{{tags}}</div><ol class="milestones">{{events}}</ol></div></article>
